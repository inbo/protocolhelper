on:
  push:
    branches:
      - main
      - master
permissions:
  contents: write

name: "check package on main with checklist"

jobs:
  check-package:
    runs-on: ubuntu-latest
    name: "check package"
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}
      R_KEYRING_BACKEND: env
    steps:
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - run: tlmgr --version

      - uses: inbo/actions/check_pkg@main
