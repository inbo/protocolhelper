on:
  push:
    branches-ignore:
      - main
      - master
      - ghpages

name: "check package with checklist"

jobs:
  check-package:
    runs-on: ubuntu-latest
    name: "check package"
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}
    permissions:
      contents: read
    steps:
      - uses: inbo/actions/check_pkg@main
        with:
          cmd: |
            sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra
